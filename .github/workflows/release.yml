name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VPK_VERSION: "1.2.161"
      REPO_URL: https://github.com/berkaygulerr/OyunAltyazi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test (Core + Translation)
        shell: bash
        run: |
          dotnet test tests/OyunAltyazi.Core.Tests -c Release --nologo -v q
          dotnet test tests/OyunAltyazi.Translation.Tests -c Release --nologo -v q
      - name: Publish
        shell: bash
        run: |
          ver="1.0.${{ github.run_number }}"
          dotnet publish src/OyunAltyazi.App -c Release -r win-x64 --self-contained -p:Version=$ver -o publish
      - name: Install vpk
        run: dotnet tool install -g vpk --version $env:VPK_VERSION
      - name: Download previous release (for deltas)
        shell: bash
        continue-on-error: true
        run: vpk download github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}"
      - name: Pack
        shell: bash
        run: |
          ver="1.0.${{ github.run_number }}"
          vpk pack -u OyunAltyazi -v $ver -p publish -e OyunAltyazi.App.exe --packTitle OyunAltyazi --icon src/OyunAltyazi.App/app.ico
      - name: Upload
        shell: bash
        run: |
          ver="1.0.${{ github.run_number }}"
          vpk upload github --repoUrl "$REPO_URL" --publish --releaseName "OyunAltyazi $ver" --tag v$ver --token "${{ secrets.GITHUB_TOKEN }}"
